<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes avatars</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--fg:#1d1a33;--card:#fff;--mut:#6b6880;--ac:#ff9f1c;--line:#ddd8cf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16142a;--fg:#f1eefc;--card:#221f3d;--mut:#a39fc0;--line:#38345c}}
:root[data-theme="dark"]{--bg:#16142a;--fg:#f1eefc;--card:#221f3d;--mut:#a39fc0;--line:#38345c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.4}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:2rem;margin:0 0 4px}
p.sub{color:var(--mut);margin:0 0 14px}
button,label.btn{font:inherit;cursor:pointer;border:2px solid var(--fg);background:var(--card);color:var(--fg);padding:9px 12px;border-radius:12px;font-weight:700}
button:focus-visible,label.btn:focus-within{outline:3px solid var(--ac);outline-offset:2px}
label.btn{position:relative;overflow:hidden;display:inline-block}
input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.primary{background:var(--ac);color:#1d1a33}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
#stage{border:1px solid var(--line);border-radius:20px;padding:26px;display:flex;justify-content:center;overflow:hidden}
#av{width:min(260px,70vw);aspect-ratio:1;border:8px solid #ff9f1c;overflow:hidden;background:#ffffff99}
#av svg,#grid svg{width:100%;height:100%;display:block}
#av canvas{width:100%;height:100%;object-fit:cover;display:block}
#av img,#grid img{width:100%;height:100%;object-fit:cover;display:block}
.circle{border-radius:50%}.round{border-radius:28px}.square{border-radius:0}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;margin-top:14px}
#grid button{padding:0;border-width:3px;border-radius:14px;overflow:hidden;aspect-ratio:1}
#grid button[aria-pressed="true"]{border-color:var(--ac)}
input[type=color]{width:44px;height:44px;border:2px solid var(--fg);border-radius:12px;padding:2px;background:var(--card)}
.danger{border-color:#c0392b;color:#c0392b}
.hide{display:none}
#msg{color:var(--mut);min-height:1.4em}
small{color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>Mes avatars</h1>
<p class="sub">Crée des avatars, ajoute tes photos, change d'apparence et anime-les avec ta caméra. <small>Version 3</small></p>
<div id="stage"><div id="av" class="circle"></div></div>
<p id="msg" aria-live="polite"></p>
<div class="row">
<button id="new" class="primary">Nouvel avatar au hasard</button>
<label class="btn">Ajouter mes photos<input id="file" type="file" accept="image/*" multiple></label>
<button id="rand">Mélanger</button>
</div>
<div class="row gen"><button data-p="hs" data-n="4">Coiffure</button><button data-p="es" data-n="3">Yeux</button><button data-p="ac" data-n="3">Accessoire</button><button id="cols">Couleurs</button></div>
<div class="row"><button data-s="circle">Rond</button><button data-s="round">Arrondi</button><button data-s="square">Carré</button>
<small>Cadre</small><input id="col" type="color" aria-label="Couleur du cadre"><small>Fond</small><input id="bgc" type="color" aria-label="Couleur du fond"></div>
<div class="row"><button id="live">Animer avec ma caméra</button><button id="mir">Miroir</button><button id="dl">Télécharger l'image</button><button id="del" class="danger">Supprimer</button></div>
<div id="grid"></div>
</main>
<script>
const $=s=>document.querySelector(s),P=a=>a[Math.floor(Math.random()*a.length)],R=n=>Math.floor(Math.random()*n);
const SK=['#f5d0b0','#e0a878','#c68642','#8d5524','#5c3a1e'],HC=['#1b1b1b','#4a2c17','#a0522d','#e6b422','#d2457a','#3d6ee0'],OC=['#ff9f1c','#2ec4b6','#e63946','#6a4cff','#2b9348','#111827'],BG=['#ffe9c7','#d6f1ee','#fbd5d9','#ddd6ff','#d3f0dc','#e5e7eb'];
const rnd=()=>({sk:P(SK),hc:P(HC),oc:P(OC),hs:R(4),es:R(3),ac:R(3)});
const gen=()=>({kind:'gen',a:rnd(),shape:'circle',color:P(OC),bg:P(BG)});
function svg(a,m,b){
  m=m||0;const h=a.hc;
  const back=a.hs==1?`<path d="M50 90c-5-55 25-70 50-70s55 15 50 70v60h-22v-70c-15-5-45-5-56 0v70H50z" fill="${h}"/>`:a.hs==2?`<circle cx="100" cy="70" r="58" fill="${h}"/>`:'';
  const front=a.hs==0?`<path d="M52 85c0-45 25-60 48-60s48 15 48 60c-10-20-30-28-48-28s-38 8-48 28z" fill="${h}"/>`:a.hs==1?`<path d="M55 80c10-30 30-40 45-40s35 10 45 40c-20-12-70-12-90 0z" fill="${h}"/>`:'';
  const eyes=b&&a.es!=1?`<path d="M72 94h16M112 94h16" stroke="#222" stroke-width="4" stroke-linecap="round"/>`:[`<circle cx="80" cy="92" r="5" fill="#222"/><circle cx="120" cy="92" r="5" fill="#222"/>`,`<path d="M72 94q8-10 16 0M112 94q8-10 16 0" stroke="#222" stroke-width="4" fill="none" stroke-linecap="round"/>`,`<circle cx="80" cy="92" r="9" fill="#fff"/><circle cx="120" cy="92" r="9" fill="#fff"/><circle cx="82" cy="93" r="5" fill="#222"/><circle cx="122" cy="93" r="5" fill="#222"/>`][a.es];
  const mouth=m>.1?`<ellipse cx="100" cy="124" rx="13" ry="${3+m*12}" fill="#7a2b2b"/>`:`<path d="M86 120q14 12 28 0" stroke="#7a2b2b" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  const acc=[``,`<g fill="none" stroke="#222" stroke-width="3"><circle cx="80" cy="92" r="14"/><circle cx="120" cy="92" r="14"/><path d="M94 92h12"/></g>`,`<rect x="48" y="58" width="104" height="9" rx="4" fill="#d1453b"/><path d="M62 60c0-38 18-46 38-46s38 8 38 46z" fill="#d1453b"/>`][a.ac];
  return `<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">${back}<path d="M40 200c0-40 30-55 60-55s60 15 60 55z" fill="${a.oc}"/><rect x="88" y="120" width="24" height="32" fill="${a.sk}"/><ellipse cx="100" cy="90" rx="45" ry="52" fill="${a.sk}"/>${front}${eyes}${mouth}${acc}</svg>`;
}
let db=null,items=[],sel=null;
function open(){return new Promise(ok=>{try{const r=indexedDB.open('avatars2',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>ok()}catch(e){ok()}})}
const st=m=>db.transaction('p',m).objectStore('p');
function all(){return new Promise(ok=>{if(!db)return ok(items);try{const q=st('readonly').getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(items)}catch(e){ok(items)}})}
function save(o){return new Promise(ok=>{if(!db){if(!o.id)o.id=Date.now()+Math.random();items=items.filter(i=>i.id!==o.id).concat(o);return ok(o.id)}try{const q=st('readwrite').put(o);q.onsuccess=()=>{o.id=q.result;ok(q.result)};q.onerror=()=>ok()}catch(e){ok()}})}
function rem(id){return new Promise(ok=>{if(!db){items=items.filter(i=>i.id!==id);return ok()}try{const q=st('readwrite').delete(id);q.onsuccess=()=>ok();q.onerror=()=>ok()}catch(e){ok()}})}
const cur=()=>items.find(i=>i.id===sel);
const msg=t=>$('#msg').textContent=t||'';
const draw=(c,m)=>c.kind==='gen'?svg(c.a,m):`<img alt="" src="${c.src}">`;
async function refresh(){
  items=await all();
  if(!cur())sel=items.length?items[items.length-1].id:null;
  const g=$('#grid');g.innerHTML='';
  items.forEach(i=>{const b=document.createElement('button');b.setAttribute('aria-pressed',i.id===sel);b.setAttribute('aria-label','Choisir cet avatar');b.style.background=i.bg;b.innerHTML=draw(i);b.onclick=()=>{sel=i.id;refresh()};g.appendChild(b)});
  const c=cur();if(!c)return;
  const av=$('#av');av.className=c.shape;av.style.borderColor=c.color;av.innerHTML=draw(c);
  $('#stage').style.background=c.bg;$('#col').value=c.color;$('#bgc').value=c.bg;
  document.querySelectorAll('.gen').forEach(e=>e.classList.toggle('hide',c.kind!=='gen'));
}
const edit=async f=>{const c=cur();if(c){f(c);await save(c);refresh()}};
$('#new').onclick=async()=>{const o=gen();sel=await save(o)||o.id;refresh()};
$('#rand').onclick=()=>{if(items.length){sel=P(items).id;refresh()}};
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>edit(c=>{c.a[b.dataset.p]=(c.a[b.dataset.p]+1)%+b.dataset.n}));
$('#cols').onclick=()=>edit(c=>{c.a.sk=P(SK);c.a.hc=P(HC);c.a.oc=P(OC)});
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>edit(c=>c.shape=b.dataset.s));
$('#col').onchange=e=>edit(c=>c.color=e.target.value);
$('#bgc').onchange=e=>edit(c=>c.bg=e.target.value);
$('#del').onclick=async()=>{const c=cur();if(c){await rem(c.id);sel=null;refresh()}};
async function shrink(f){try{const b=await createImageBitmap(f);const k=Math.min(1,700/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.85)}catch(e){return new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>ok(null);r.readAsDataURL(f)})}}
$('#file').onchange=async e=>{
  const fs=[...e.target.files];e.target.value='';
  for(const f of fs){const src=await shrink(f);if(!src)continue;const o={kind:'photo',src,shape:'circle',color:P(OC),bg:P(BG)};sel=await save(o)||o.id}
  refresh();
};
$('#dl').onclick=async()=>{
  const c=cur();if(!c)return;
  try{
    const img=new Image();img.src=c.kind==='gen'?'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg(c.a,0)):c.src;await img.decode();
    const S=640,z=480,o=(S-z)/2,k=document.createElement('canvas');k.width=k.height=S;const g=k.getContext('2d');
    const path=()=>{g.beginPath();if(c.shape==='circle')g.arc(S/2,S/2,z/2,0,7);else if(c.shape==='round'&&g.roundRect)g.roundRect(o,o,z,z,z*.12);else g.rect(o,o,z,z)};
    g.fillStyle=c.bg;g.fillRect(0,0,S,S);
    g.save();path();g.clip();g.fillStyle='#ffffff99';g.fillRect(o,o,z,z);
    const w=img.width,h=img.height,m=Math.min(w,h);g.drawImage(img,(w-m)/2,(h-m)/2,m,m,o,o,z,z);g.restore();
    path();g.lineWidth=16;g.strokeStyle=c.color;g.stroke();
    k.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='avatar.png';a.click();msg("Image téléchargée.")});
  }catch(e){msg("Le téléchargement n'est pas possible ici. Ouvre le fichier dans Chrome.")}
};
let live=null,FL=null,mir=false;
const PM={},LIP=new Set([78,191,80,81,82,13,312,311,310,415,308,324,318,402,317,14,87,178,88,95]);
async function loadFace(){
  if(FL)return FL;
  const V='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const {FaceLandmarker,FilesetResolver}=await import(V+'/+esm');
  const fs=await FilesetResolver.forVisionTasks(V+'/wasm');
  const mk=d=>FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:d},runningMode:'VIDEO',numFaces:1});
  try{FL=await mk('GPU')}catch(e){FL=await mk('CPU')}
  return FL;
}
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function delaunay(P){
  const n=P.length;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const [x,y] of P){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
  const d=Math.max(x1-x0,y1-y0)*20,mx=(x0+x1)/2,my=(y0+y1)/2;
  const V=P.concat([[mx-d,my-d],[mx,my+d],[mx+d,my-d]]);
  const cc=t=>{const [a,b,c]=t.map(i=>V[i]);const D=2*(a[0]*(b[1]-c[1])+b[0]*(c[1]-a[1])+c[0]*(a[1]-b[1]));const sa=a[0]*a[0]+a[1]*a[1],sb=b[0]*b[0]+b[1]*b[1],sc=c[0]*c[0]+c[1]*c[1];const ux=(sa*(b[1]-c[1])+sb*(c[1]-a[1])+sc*(a[1]-b[1]))/D,uy=(sa*(c[0]-b[0])+sb*(a[0]-c[0])+sc*(b[0]-a[0]))/D;return [ux,uy,(a[0]-ux)**2+(a[1]-uy)**2]};
  let T=[[n,n+1,n+2]].map(t=>({t,c:cc(t)}));
  for(let i=0;i<n;i++){
    const [x,y]=V[i],keep=[],E={};
    for(const o of T){const [ux,uy,r]=o.c;if((x-ux)**2+(y-uy)**2<r){for(let k=0;k<3;k++){const a=o.t[k],b=o.t[(k+1)%3],key=a<b?a+','+b:b+','+a;E[key]=(E[key]||0)+1}}else keep.push(o)}
    for(const o of T){const [ux,uy,r]=o.c;if((x-ux)**2+(y-uy)**2<r)for(let k=0;k<3;k++){const a=o.t[k],b=o.t[(k+1)%3],key=a<b?a+','+b:b+','+a;if(E[key]===1){const t=[a,b,i];keep.push({t,c:cc(t)})}}}
    T=keep;
  }
  return T.map(o=>o.t).filter(t=>t.every(i=>i<n));
}
function tri(g,img,s,d,dark){
  const [x0,y0]=s[0],[x1,y1]=s[1],[x2,y2]=s[2],[u0,v0]=d[0],[u1,v1]=d[1],[u2,v2]=d[2];
  const D=x0*(y1-y2)+x1*(y2-y0)+x2*(y0-y1);if(Math.abs(D)<1e-6)return;
  const mx=(u0+u1+u2)/3,my=(v0+v1+v2)/3,ex=([u,v])=>{const l=Math.hypot(u-mx,v-my)||1;return [u+(u-mx)/l*.7,v+(v-my)/l*.7]};
  const [a,b,c]=[[u0,v0],[u1,v1],[u2,v2]].map(ex);
  g.save();g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineTo(c[0],c[1]);g.closePath();
  if(dark){g.fillStyle='#3a1014';g.fill();g.restore();return}
  g.clip();
  g.setTransform((u0*(y1-y2)+u1*(y2-y0)+u2*(y0-y1))/D,(v0*(y1-y2)+v1*(y2-y0)+v2*(y0-y1))/D,(u0*(x2-x1)+u1*(x0-x2)+u2*(x1-x0))/D,(v0*(x2-x1)+v1*(x0-x2)+v2*(x1-x0))/D,(u0*(x1*y2-x2*y1)+u1*(x2*y0-x0*y2)+u2*(x0*y1-x1*y0))/D,(v0*(x1*y2-x2*y1)+v1*(x2*y0-x0*y2)+v2*(x0*y1-x1*y0))/D);
  const bx=Math.floor(Math.min(x0,x1,x2))-1,by=Math.floor(Math.min(y0,y1,y2))-1,bw=Math.ceil(Math.max(x0,x1,x2))-bx+1,bh=Math.ceil(Math.max(y0,y1,y2))-by+1;
  g.drawImage(img,bx,by,bw,bh,bx,by,bw,bh);g.restore();
}
async function prep(c,fl){
  const img=new Image();img.src=c.src;await img.decode();
  await fl.setOptions({runningMode:'IMAGE'});
  const r=fl.detect(img);
  await fl.setOptions({runningMode:'VIDEO'});
  const p=r.faceLandmarks&&r.faceLandmarks[0];
  if(!p)return {id:c.id,fail:true};
  const P=p.slice(0,468).map(o=>[o.x*img.width,o.y*img.height]);
  const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;
  return {id:c.id,img,P,T:delaunay(P),cv,g:cv.getContext('2d'),cx:P.reduce((s,q)=>s+q[0],0)/468,cy:P.reduce((s,q)=>s+q[1],0)/468,ed:Math.hypot(P[263][0]-P[33][0],P[263][1]-P[33][1])};
}
function paint(pm,q){
  const g=pm.g;g.setTransform(1,0,0,1,0,0);g.drawImage(pm.img,0,0);
  let lx=0,ly=0;for(const t of q){lx+=t[0];ly+=t[1]}lx/=468;ly/=468;
  const k=pm.ed/Math.hypot(q[263][0]-q[33][0],q[263][1]-q[33][1]);
  const D=q.map(t=>[pm.cx+(t[0]-lx)*k,pm.cy+(t[1]-ly)*k]);
  for(const [a,b,c] of pm.T)tri(g,pm.img,[pm.P[a],pm.P[b],pm.P[c]],[D[a],D[b],D[c]],LIP.has(a)&&LIP.has(b)&&LIP.has(c));
}
$('#mir').onclick=()=>{mir=!mir;$('#mir').style.background=mir?'var(--ac)':''};
$('#live').onclick=async()=>{
  if(live){live.stop();return}
  try{
    msg('Chargement du suivi du visage...');
    const [fl,ms]=await Promise.all([loadFace(),navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}})]);
    const v=document.createElement('video');v.muted=true;v.playsInline=true;v.srcObject=ms;await v.play();
    const s={x:0,y:0,rx:0,ry:0,rz:0,sc:1,m:0};let base=null,key='',last=-1,on=true,blink=false,busy=false;const av=$('#av');
    (function loop(){
      if(!on)return;
      if(!busy&&v.currentTime!==last){
        last=v.currentTime;
        const c=cur();
        if(c&&c.kind==='photo'&&!PM[c.id]){
          busy=true;msg('Analyse de ta photo...');
          prep(c,fl).catch(()=>({id:c.id,fail:true})).then(x=>{PM[c.id]=x;msg(x.fail?"Je ne vois pas de visage dans cette photo. Choisis une photo de face, visage bien visible.":"Bouge, parle, souris : la photo te suit.")}).finally(()=>{busy=false});
        }else{
        const r=fl.detectForVideo(v,performance.now()),p=r.faceLandmarks&&r.faceLandmarks[0],pm=c&&c.kind==='photo'?PM[c.id]:null;
        if(p&&pm&&!pm.fail){
          if(!av.contains(pm.cv)){av.innerHTML='';av.appendChild(pm.cv)}
          av.style.transform='';pm.cv.style.transform=mir?'scaleX(-1)':'';
          paint(pm,p.slice(0,468).map(o=>[o.x*v.videoWidth,o.y*v.videoHeight]));
        }else if(p){
          const L=p[33],R=p[263],N=p[1],U=p[13],D=p[14],T=p[10],C=p[152];
          const ex=(L.x+R.x)/2,ey=(L.y+R.y)/2,ed=Math.hypot(R.x-L.x,R.y-L.y);
          const pr=(N.y-ey)/ed;if(!base)base={pr,ed};
          const t={x:-(N.x-.5)*2*70,y:(N.y-.5)*2*40,ry:cl((N.x-ex)/ed*110,-40,40),rx:cl(-(pr-base.pr)*110,-30,30),rz:-Math.atan2(R.y-L.y,R.x-L.x)*180/Math.PI,sc:cl(ed/base.ed,.8,1.3),m:cl(((D.y-U.y)/(C.y-T.y)-.015)/.08,0,1)};
          for(const q in t)s[q]+=(t[q]-s[q])*.4;
          blink=Math.abs(p[159].y-p[145].y)/Math.abs(p[33].x-p[133].x)<.12;
          av.style.transform=`translate(${s.x}px,${s.y}px) perspective(500px) rotateX(${s.rx}deg) rotateY(${s.ry}deg) rotateZ(${s.rz}deg) scale(${s.sc})`;
          const nk=Math.round(s.m*10)+':'+blink;
          if(c&&c.kind==='gen'&&nk!==key){key=nk;av.innerHTML=svg(c.a,s.m,blink)}
        }}
      }
      requestAnimationFrame(loop);
    })();
    live={stop(){on=false;ms.getTracks().forEach(t=>t.stop());av.style.transform='';live=null;$('#live').textContent='Animer avec ma caméra';msg();refresh()}};
    $('#live').textContent="Arrêter l'animation";msg("Regarde la caméra et bouge.");
  }catch(e){msg("Le suivi du visage n'a pas démarré ("+(e&&e.name||'erreur')+"). Vérifie ta connexion et autorise la caméra.")}
};
open().then(async()=>{items=await all();if(!items.length){for(let i=0;i<4;i++)await save(gen())}refresh()});
</script>
</body>
</html>
